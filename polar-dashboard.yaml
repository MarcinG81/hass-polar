# ============================================================================
#  Polar – dashboard for training + sleep tracking  (Mushroom + statistics-graph)
# ============================================================================
#  REQUIRES (HACS): Lovelace Mushroom.  History uses the built-in
#  statistics-graph card (no ApexCharts needed).
#
#  ENTITY IDS: the Polar sensors are prefixed with your device name. For a
#  device called "Polar Loop" they look like sensor.polar_loop_deep_sleep.
#  If yours differ, in the raw editor find-replace "sensor.polar_loop_" with
#  your own prefix (check Developer Tools -> States).
#
#  The backfilled history is attached to the sensors themselves, so the
#  statistics-graph cards simply chart the sensor.polar_loop_* entities.
#
#  HOW TO ADD/UPDATE (repo changes do NOT auto-apply to your dashboard):
#  Your Polar dashboard -> edit (pencil) -> top-right menu -> "Raw
#  configuration editor" -> select all, delete, paste this file -> Save ->
#  hard refresh the browser (Cmd/Ctrl+Shift+R).
# ============================================================================

title: Polar
views:
  # ==========================================================================
  #  VIEW 1 – TODAY  (Mushroom, live data)
  # ==========================================================================
  - title: Today
    path: today
    icon: mdi:heart-pulse
    cards:
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: sensor.polar_loop_heart_rate
            icon: mdi:heart-pulse
            icon_color: red
          - type: entity
            entity: sensor.polar_loop_heart_rate_variability
            icon: mdi:sine-wave
            icon_color: teal
          - type: entity
            entity: sensor.polar_loop_last_nightly_recharge
            icon: mdi:bed-clock
            icon_color: indigo
          - type: entity
            entity: sensor.polar_loop_daily_activity_steps
            icon: mdi:shoe-print
            icon_color: green

      - type: custom:mushroom-title-card
        title: Now

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Heart rate
            secondary: "{{ states('sensor.polar_loop_heart_rate') }} bpm"
            icon: mdi:heart-pulse
            icon_color: >-
              {% set v = states('sensor.polar_loop_heart_rate') | int(0) %}
              {% if v == 0 %}grey{% elif v < 100 %}green{% elif v < 140 %}orange{% else %}red{% endif %}
          - type: custom:mushroom-template-card
            primary: HRV
            secondary: "{{ states('sensor.polar_loop_heart_rate_variability') }} ms"
            icon: mdi:sine-wave
            icon_color: teal
          - type: custom:mushroom-template-card
            primary: Breathing
            secondary: "{{ states('sensor.polar_loop_breathing_rate') }} /min"
            icon: mdi:lungs
            icon_color: light-blue
          - type: custom:mushroom-template-card
            primary: Weight
            secondary: "{{ states('sensor.polar_loop_weight') }} kg"
            icon: mdi:scale-bathroom
            icon_color: blue-grey

      - type: custom:mushroom-title-card
        title: Last night

      - type: custom:mushroom-template-card
        primary: Sleep score
        secondary: "{{ states('sensor.polar_loop_last_sleep_score') }} / 100"
        icon: mdi:star-circle
        icon_color: >-
          {% set v = states('sensor.polar_loop_last_sleep_score') | int(0) %}
          {% if v >= 80 %}green{% elif v >= 60 %}orange{% else %}red{% endif %}

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Deep
            secondary: "{{ state_attr('sensor.polar_loop_deep_sleep','duration') | default('—', true) }}"
            icon: mdi:sleep
            icon_color: indigo
          - type: custom:mushroom-template-card
            primary: Light
            secondary: "{{ state_attr('sensor.polar_loop_light_sleep','duration') | default('—', true) }}"
            icon: mdi:power-sleep
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: REM
            secondary: "{{ state_attr('sensor.polar_loop_rem_sleep','duration') | default('—', true) }}"
            icon: mdi:eye
            icon_color: purple

      - type: custom:mushroom-template-card
        primary: Nightly Recharge
        secondary: "Status {{ states('sensor.polar_loop_last_nightly_recharge') }} / 6"
        icon: mdi:battery-heart-variant
        icon_color: >-
          {% set v = states('sensor.polar_loop_last_nightly_recharge') | int(0) %}
          {% if v >= 5 %}green{% elif v >= 3 %}orange{% else %}red{% endif %}

      - type: custom:mushroom-title-card
        title: Last workout

      - type: custom:mushroom-template-card
        primary: "{{ state_attr('sensor.polar_loop_last_exercise','sport') | default('Workout', true) }}"
        secondary: >-
          {% set t = states('sensor.polar_loop_last_exercise') %}
          {% if t in ['unknown','unavailable','none','',None] %}no data
          {% else %}{{ as_timestamp(t, 0) | timestamp_custom('%d.%m %H:%M', true) }}{% endif %}
        icon: mdi:run
        icon_color: deep-orange

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: HR avg
            secondary: "{{ states('sensor.polar_loop_last_exercise_heart_rate_average') }} bpm"
            icon: mdi:heart-pulse
            icon_color: orange
          - type: custom:mushroom-template-card
            primary: HR max
            secondary: "{{ states('sensor.polar_loop_last_exercise_heart_rate_maximum') }} bpm"
            icon: mdi:heart-flash
            icon_color: red
          - type: custom:mushroom-template-card
            primary: Cardio load
            secondary: "{{ states('sensor.polar_loop_cardio_load') }}"
            icon: mdi:weight-lifter
            icon_color: amber

  # ==========================================================================
  #  VIEW 2 – SLEEP  (history / backfill, statistics-graph)
  # ==========================================================================
  - title: Sleep
    path: sleep
    icon: mdi:sleep
    cards:
      - type: statistics-graph
        title: Sleep stages – last 28 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: sensor.polar_loop_deep_sleep
            name: Deep
          - entity: sensor.polar_loop_light_sleep
            name: Light
          - entity: sensor.polar_loop_rem_sleep
            name: REM

      - type: statistics-graph
        title: Sleep score – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: sensor.polar_loop_last_sleep_score
            name: Sleep score

      - type: statistics-graph
        title: HRV and breathing (night) – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: sensor.polar_loop_heart_rate_variability
            name: HRV
          - entity: sensor.polar_loop_breathing_rate
            name: Breathing

  # ==========================================================================
  #  VIEW 3 – TRAINING
  # ==========================================================================
  - title: Training
    path: training
    icon: mdi:run-fast
    cards:
      - type: statistics-graph
        title: Cardio load – last 28 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: sensor.polar_loop_cardio_load
            name: Cardio load

      - type: statistics-graph
        title: Heart rate (continuous) – last 7 days, hourly
        chart_type: line
        period: hour
        days_to_show: 7
        stat_types:
          - mean
          - min
          - max
        entities:
          - entity: sensor.polar_loop_heart_rate
            name: Heart rate

      - type: history-graph
        title: Heart rate today (live)
        hours_to_show: 24
        entities:
          - entity: sensor.polar_loop_heart_rate
            name: Heart rate

      - type: glance
        title: Last workout – heart rate
        columns: 2
        entities:
          - entity: sensor.polar_loop_last_exercise_heart_rate_average
            name: Average
          - entity: sensor.polar_loop_last_exercise_heart_rate_maximum
            name: Maximum
