# ============================================================================
#  Polar – history dashboard for training + sleep tracking
# ============================================================================
#  Polar data is published as long-term statistics (polar:*). All views use the
#  built-in cards (statistics-graph, calendar, markdown) - no custom HACS cards.
#
#  HOW TO ADD/UPDATE (repo changes do NOT auto-apply to your dashboard):
#  New dashboard -> edit (pencil) -> top-right menu -> "Raw configuration
#  editor" -> select all, delete, paste this file -> Save -> hard refresh
#  the browser (Cmd/Ctrl+Shift+R).
#
#  The statistics appear after the first sync. You can verify them under
#  Developer Tools -> Statistics (search "polar").
# ============================================================================

title: Polar
views:
  # ==========================================================================
  #  SLEEP
  # ==========================================================================
  - title: Sleep
    path: sleep
    icon: mdi:sleep
    cards:
      - type: calendar
        title: Sleep nights
        initial_view: listWeek
        entities:
          - calendar.polar_loop_sleep

      - type: statistics-graph
        title: Sleep stages – last 28 days (minutes)
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:deep_sleep
            name: Deep
          - entity: polar:light_sleep
            name: Light
          - entity: polar:rem_sleep
            name: REM

      - type: statistics-graph
        title: Sleep score – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:sleep_score
            name: Sleep score

      - type: statistics-graph
        title: HRV and breathing (night) – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:heart_rate_variability
            name: HRV
          - entity: polar:breathing_rate
            name: Breathing

  # ==========================================================================
  #  TRAINING
  # ==========================================================================
  - title: Training
    path: training
    icon: mdi:run-fast
    cards:
      - type: calendar
        title: Workouts
        initial_view: listWeek
        entities:
          - calendar.polar_loop_exercises

      - type: markdown
        title: Recent workouts
        content: |
          {% set rows = state_attr('sensor.polar_loop_last_exercise', 'exercises') or [] %}
          | Date | Sport | Duration | Distance | Cal | Load | Muscle | HR max |
          |---|---|---|---|---|---|---|---|
          {% for e in rows %}| {{ (e.start_time[:16] | replace('T', ' ')) if e.start_time else e.date }} | {{ e.sport }} | {{ e.duration.split('.')[0].rsplit(':', 1)[0] if e.duration else '—' }} | {{ (e.distance_km ~ ' km') if e.distance_km else '—' }} | {{ e.calories or '—' }} | {{ e.training_load or e.cardio_load or '—' }} | {{ e.muscle_load or '—' }} | {{ e.heart_rate_maximum or '—' }} |
          {% endfor %}

      - type: statistics-graph
        title: Cardio load – last 28 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:cardio_load
            name: Cardio load

  # ==========================================================================
  #  HEART RATE
  # ==========================================================================
  - title: Heart rate
    path: heart-rate
    icon: mdi:heart-pulse
    cards:
      - type: statistics-graph
        title: Heart rate – last 28 days (hourly)
        chart_type: line
        period: hour
        days_to_show: 28
        stat_types:
          - mean
          - min
          - max
        entities:
          - entity: polar:heart_rate
            name: Heart rate
