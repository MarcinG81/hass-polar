# ============================================================================
#  Polar – PREMIUM dashboard (Mushroom + ApexCharts)
#  dla trenującego + tracking snu
# ============================================================================
#  WYMAGA (HACS):  Lovelace Mushroom  +  ApexCharts Card
#
#  JAK UŻYĆ:
#  1) Ustawienia → Dashboardy → Dodaj dashboard → Nowy → otwórz → ołówek →
#     ⋮ → "Edytor surowej konfiguracji" → wklej całość.
#  2) PREFIKS ENCJI: jeśli Twoje encje mają imię w id (np.
#     sensor.marcin_gaszewski_deep_sleep), zrób find-replace:
#         "sensor."  ->  "sensor.marcin_gaszewski_"
#     (sprawdź w Narzędzia deweloperskie → Stany). Statystyki polar:* zostaw.
#  3) Wykresy polar:* pokażą się po update do 1.6.0 + restart (backfill).
# ============================================================================

title: Polar
views:
  # ==========================================================================
  #  WIDOK 1 – DZIŚ
  # ==========================================================================
  - title: Dziś
    path: dzis
    icon: mdi:heart-pulse
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Teraz
            heading_style: title
            icon: mdi:heart-pulse

          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: sensor.heart_rate
                icon: mdi:heart-pulse
                icon_color: red
              - type: entity
                entity: sensor.heart_rate_variability
                icon: mdi:sine-wave
                icon_color: teal
              - type: entity
                entity: sensor.last_nightly_recharge
                icon: mdi:bed-clock
                icon_color: indigo
              - type: entity
                entity: sensor.daily_activity_steps
                icon: mdi:shoe-print
                icon_color: green

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Tętno
                secondary: "{{ states('sensor.heart_rate') }} bpm"
                icon: mdi:heart-pulse
                icon_color: >-
                  {% set v = states('sensor.heart_rate')|int(0) %}
                  {% if v == 0 %}grey{% elif v < 100 %}green
                  {% elif v < 140 %}orange{% else %}red{% endif %}
              - type: custom:mushroom-template-card
                primary: HRV
                secondary: "{{ states('sensor.heart_rate_variability') }} ms"
                icon: mdi:sine-wave
                icon_color: teal
              - type: custom:mushroom-template-card
                primary: Oddech
                secondary: "{{ states('sensor.breathing_rate') }} /min"
                icon: mdi:lungs
                icon_color: light-blue
              - type: custom:mushroom-template-card
                primary: Waga
                secondary: "{{ states('sensor.weight') }} kg"
                icon: mdi:scale-bathroom
                icon_color: blue-grey

      - type: grid
        cards:
          - type: heading
            heading: Ostatnia noc
            heading_style: title
            icon: mdi:sleep

          - type: custom:mushroom-template-card
            primary: Sleep score
            secondary: "{{ states('sensor.last_sleep_score') }} / 100"
            icon: mdi:star-circle
            icon_color: >-
              {% set v = states('sensor.last_sleep_score')|int(0) %}
              {% if v >= 80 %}green{% elif v >= 60 %}orange{% else %}red{% endif %}
            multiline_secondary: true

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Głęboki
                secondary: "{{ state_attr('sensor.deep_sleep','duration') }}"
                icon: mdi:sleep
                icon_color: indigo
              - type: custom:mushroom-template-card
                primary: Lekki
                secondary: "{{ state_attr('sensor.light_sleep','duration') }}"
                icon: mdi:power-sleep
                icon_color: blue
              - type: custom:mushroom-template-card
                primary: REM
                secondary: "{{ state_attr('sensor.rem_sleep','duration') }}"
                icon: mdi:eye
                icon_color: purple

          - type: custom:mushroom-template-card
            primary: Nightly Recharge
            secondary: "Status {{ states('sensor.last_nightly_recharge') }} / 6"
            icon: mdi:battery-heart-variant
            icon_color: >-
              {% set v = states('sensor.last_nightly_recharge')|int(0) %}
              {% if v >= 5 %}green{% elif v >= 3 %}orange{% else %}red{% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Ostatni trening
            heading_style: title
            icon: mdi:run-fast

          - type: custom:mushroom-template-card
            primary: "{{ state_attr('sensor.last_exercise','sport') | default('Trening') }}"
            secondary: >-
              {{ as_timestamp(states('sensor.last_exercise')) | timestamp_custom('%d.%m %H:%M', true) }}
            icon: mdi:run
            icon_color: deep-orange

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: HR śr.
                secondary: "{{ states('sensor.last_exercise_heart_rate_average') }} bpm"
                icon: mdi:heart-pulse
                icon_color: orange
              - type: custom:mushroom-template-card
                primary: HR max
                secondary: "{{ states('sensor.last_exercise_heart_rate_maximum') }} bpm"
                icon: mdi:heart-flash
                icon_color: red
              - type: custom:mushroom-template-card
                primary: Cardio load
                secondary: "{{ states('sensor.cardio_load') }}"
                icon: mdi:weight-lifter
                icon_color: amber

  # ==========================================================================
  #  WIDOK 2 – SEN (historia / backfill)
  # ==========================================================================
  - title: Sen
    path: sen
    icon: mdi:sleep
    cards:
      - type: custom:apexcharts-card
        header:
          show: true
          title: Fazy snu – 28 dni (godziny)
          show_states: false
        graph_span: 28d
        stacked: true
        apex_config:
          chart:
            height: 280
          yaxis:
            decimalsInFloat: 1
            forceNiceScale: true
        series:
          - entity: polar:deep_sleep
            name: Głęboki
            type: column
            color: '#3f51b5'
            statistics:
              type: mean
              period: day
            transform: "return x / 60;"
          - entity: polar:light_sleep
            name: Lekki
            type: column
            color: '#2196f3'
            statistics:
              type: mean
              period: day
            transform: "return x / 60;"
          - entity: polar:rem_sleep
            name: REM
            type: column
            color: '#9c27b0'
            statistics:
              type: mean
              period: day
            transform: "return x / 60;"

      - type: custom:apexcharts-card
        header:
          show: true
          title: Sleep score – 28 dni
        graph_span: 28d
        apex_config:
          chart:
            height: 220
          yaxis:
            min: 0
            max: 100
        series:
          - entity: polar:sleep_score
            name: Sleep score
            type: area
            color: '#4caf50'
            statistics:
              type: mean
              period: day

      - type: custom:apexcharts-card
        header:
          show: true
          title: HRV i oddech (noc) – 28 dni
        graph_span: 28d
        apex_config:
          chart:
            height: 220
        yaxis:
          - id: hrv
            min: 0
          - id: br
            opposite: true
            min: 0
        series:
          - entity: polar:heart_rate_variability
            name: HRV (ms)
            type: line
            color: '#009688'
            yaxis_id: hrv
            statistics:
              type: mean
              period: day
          - entity: polar:breathing_rate
            name: Oddech (/min)
            type: line
            color: '#03a9f4'
            yaxis_id: br
            statistics:
              type: mean
              period: day

  # ==========================================================================
  #  WIDOK 3 – TRENING
  # ==========================================================================
  - title: Trening
    path: trening
    icon: mdi:run-fast
    cards:
      - type: custom:apexcharts-card
        header:
          show: true
          title: Cardio load – 28 dni
        graph_span: 28d
        apex_config:
          chart:
            height: 250
        series:
          - entity: polar:cardio_load
            name: Cardio load
            type: column
            color: '#ff9800'
            statistics:
              type: mean
              period: day

      - type: custom:apexcharts-card
        header:
          show: true
          title: Tętno (continuous) – 7 dni
          show_states: true
        graph_span: 7d
        apex_config:
          chart:
            height: 250
        series:
          - entity: polar:heart_rate
            name: Średnie
            type: line
            color: '#f44336'
            stroke_width: 2
            statistics:
              type: mean
              period: hour
          - entity: polar:heart_rate
            name: Max
            type: line
            color: '#ff9800'
            opacity: 0.4
            stroke_width: 1
            statistics:
              type: max
              period: hour
          - entity: polar:heart_rate
            name: Min
            type: line
            color: '#2196f3'
            opacity: 0.4
            stroke_width: 1
            statistics:
              type: min
              period: hour

      - type: custom:apexcharts-card
        header:
          show: true
          title: Tętno dziś (live)
        graph_span: 24h
        series:
          - entity: sensor.heart_rate
            name: Tętno
            type: line
            color: '#f44336'
            group_by:
              func: avg
              duration: 10min
