# ============================================================================
#  Polar – history dashboard for training + sleep tracking
# ============================================================================
#  This integration is history-only: Polar data is published as long-term
#  statistics (polar:*), not live sensors. The dashboard therefore uses the
#  built-in statistics-graph card (no extra HACS cards required).
#
#  HOW TO ADD/UPDATE (repo changes do NOT auto-apply to your dashboard):
#  New dashboard -> edit (pencil) -> top-right menu -> "Raw configuration
#  editor" -> select all, delete, paste this file -> Save -> hard refresh
#  the browser (Cmd/Ctrl+Shift+R).
#
#  The statistics appear after the first sync. You can verify them under
#  Developer Tools -> Statistics (search "polar").
# ============================================================================

title: Polar
views:
  # ==========================================================================
  #  SLEEP
  # ==========================================================================
  - title: Sleep
    path: sleep
    icon: mdi:sleep
    cards:
      - type: statistics-graph
        title: Sleep stages – last 28 days (minutes)
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:deep_sleep
            name: Deep
          - entity: polar:light_sleep
            name: Light
          - entity: polar:rem_sleep
            name: REM

      - type: statistics-graph
        title: Sleep score – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:sleep_score
            name: Sleep score

      - type: statistics-graph
        title: HRV and breathing (night) – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:heart_rate_variability
            name: HRV
          - entity: polar:breathing_rate
            name: Breathing

  # ==========================================================================
  #  TRAINING
  # ==========================================================================
  - title: Training
    path: training
    icon: mdi:run-fast
    cards:
      - type: statistics-graph
        title: Cardio load – last 28 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:cardio_load
            name: Cardio load

  # ==========================================================================
  #  HEART RATE
  # ==========================================================================
  - title: Heart rate
    path: heart-rate
    icon: mdi:heart-pulse
    cards:
      - type: statistics-graph
        title: Heart rate – last 28 days (hourly)
        chart_type: line
        period: hour
        days_to_show: 28
        stat_types:
          - mean
          - min
          - max
        entities:
          - entity: polar:heart_rate
            name: Heart rate

      - type: statistics-graph
        title: Heart rate – last 7 days (detail)
        chart_type: line
        period: hour
        days_to_show: 7
        stat_types:
          - mean
          - min
          - max
        entities:
          - entity: polar:heart_rate
            name: Heart rate
