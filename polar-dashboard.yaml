# ============================================================================
#  Polar – dashboard dla trenującego + tracking snu  (Mushroom + wykresy)
# ============================================================================
#  WYMAGA (HACS):  Lovelace Mushroom
#  (Historia używa WBUDOWANEJ karty statistics-graph – ApexCharts nie jest
#   konieczny i bywa wybredny przy statystykach polar:*.)
#
#  JAK UŻYĆ / ZAKTUALIZOWAĆ:
#  1) Otwórz swój dashboard Polar → Edycja (ołówek) → ⋮ → "Edytor surowej
#     konfiguracji" → ZAZNACZ WSZYSTKO, USUŃ i WKLEJ całą zawartość tego
#     pliku → Zapisz.  (Zmiany w repo NIE wchodzą same – trzeba podmienić!)
#  2) Encje są bez prefiksu (potwierdzone z logów) – nic nie podmieniaj.
#  3) Wykresy polar:* zapełnią się po 1.6.3 + restart (backfill). Sprawdź:
#     Narzędzia deweloperskie → Statystyki → wpisz "polar".
# ============================================================================

title: Polar
views:
  # ==========================================================================
  #  WIDOK 1 – DZIŚ  (Mushroom, dane live)
  # ==========================================================================
  - title: Dziś
    path: dzis
    icon: mdi:heart-pulse
    cards:
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: sensor.heart_rate
            icon: mdi:heart-pulse
            icon_color: red
          - type: entity
            entity: sensor.heart_rate_variability
            icon: mdi:sine-wave
            icon_color: teal
          - type: entity
            entity: sensor.last_nightly_recharge
            icon: mdi:bed-clock
            icon_color: indigo
          - type: entity
            entity: sensor.daily_activity_steps
            icon: mdi:shoe-print
            icon_color: green

      - type: custom:mushroom-title-card
        title: Teraz

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Tętno
            secondary: "{{ states('sensor.heart_rate') }} bpm"
            icon: mdi:heart-pulse
            icon_color: >-
              {% set v = states('sensor.heart_rate') | int(0) %}
              {% if v == 0 %}grey{% elif v < 100 %}green{% elif v < 140 %}orange{% else %}red{% endif %}
          - type: custom:mushroom-template-card
            primary: HRV
            secondary: "{{ states('sensor.heart_rate_variability') }} ms"
            icon: mdi:sine-wave
            icon_color: teal
          - type: custom:mushroom-template-card
            primary: Oddech
            secondary: "{{ states('sensor.breathing_rate') }} /min"
            icon: mdi:lungs
            icon_color: light-blue
          - type: custom:mushroom-template-card
            primary: Waga
            secondary: "{{ states('sensor.weight') }} kg"
            icon: mdi:scale-bathroom
            icon_color: blue-grey

      - type: custom:mushroom-title-card
        title: Ostatnia noc

      - type: custom:mushroom-template-card
        primary: Sleep score
        secondary: "{{ states('sensor.last_sleep_score') }} / 100"
        icon: mdi:star-circle
        icon_color: >-
          {% set v = states('sensor.last_sleep_score') | int(0) %}
          {% if v >= 80 %}green{% elif v >= 60 %}orange{% else %}red{% endif %}

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Głęboki
            secondary: "{{ state_attr('sensor.deep_sleep','duration') | default('—', true) }}"
            icon: mdi:sleep
            icon_color: indigo
          - type: custom:mushroom-template-card
            primary: Lekki
            secondary: "{{ state_attr('sensor.light_sleep','duration') | default('—', true) }}"
            icon: mdi:power-sleep
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: REM
            secondary: "{{ state_attr('sensor.rem_sleep','duration') | default('—', true) }}"
            icon: mdi:eye
            icon_color: purple

      - type: custom:mushroom-template-card
        primary: Nightly Recharge
        secondary: "Status {{ states('sensor.last_nightly_recharge') }} / 6"
        icon: mdi:battery-heart-variant
        icon_color: >-
          {% set v = states('sensor.last_nightly_recharge') | int(0) %}
          {% if v >= 5 %}green{% elif v >= 3 %}orange{% else %}red{% endif %}

      - type: custom:mushroom-title-card
        title: Ostatni trening

      - type: custom:mushroom-template-card
        primary: "{{ state_attr('sensor.last_exercise','sport') | default('Trening', true) }}"
        secondary: >-
          {% set t = states('sensor.last_exercise') %}
          {% if t in ['unknown','unavailable','none','',None] %}brak danych
          {% else %}{{ as_timestamp(t, 0) | timestamp_custom('%d.%m %H:%M', true) }}{% endif %}
        icon: mdi:run
        icon_color: deep-orange

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: HR śr.
            secondary: "{{ states('sensor.last_exercise_heart_rate_average') }} bpm"
            icon: mdi:heart-pulse
            icon_color: orange
          - type: custom:mushroom-template-card
            primary: HR max
            secondary: "{{ states('sensor.last_exercise_heart_rate_maximum') }} bpm"
            icon: mdi:heart-flash
            icon_color: red
          - type: custom:mushroom-template-card
            primary: Cardio load
            secondary: "{{ states('sensor.cardio_load') }}"
            icon: mdi:weight-lifter
            icon_color: amber

  # ==========================================================================
  #  WIDOK 2 – SEN  (historia / backfill – karta wbudowana)
  # ==========================================================================
  - title: Sen
    path: sen
    icon: mdi:sleep
    cards:
      - type: statistics-graph
        title: Fazy snu – 28 dni (minuty)
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:deep_sleep
            name: Głęboki
          - entity: polar:light_sleep
            name: Lekki
          - entity: polar:rem_sleep
            name: REM

      - type: statistics-graph
        title: Sleep score – 28 dni
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:sleep_score
            name: Sleep score

      - type: statistics-graph
        title: HRV (noc) – 28 dni
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:heart_rate_variability
            name: HRV
          - entity: polar:breathing_rate
            name: Oddech

  # ==========================================================================
  #  WIDOK 3 – TRENING
  # ==========================================================================
  - title: Trening
    path: trening
    icon: mdi:run-fast
    cards:
      - type: statistics-graph
        title: Cardio load – 28 dni
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:cardio_load
            name: Cardio load

      - type: statistics-graph
        title: Tętno (continuous) – 7 dni, godzinowo
        chart_type: line
        period: hour
        days_to_show: 7
        stat_types:
          - mean
          - min
          - max
        entities:
          - entity: polar:heart_rate
            name: Tętno

      - type: history-graph
        title: Tętno dziś (live)
        hours_to_show: 24
        entities:
          - entity: sensor.heart_rate
            name: Tętno

      - type: glance
        title: Ostatni trening – tętno
        columns: 2
        entities:
          - entity: sensor.last_exercise_heart_rate_average
            name: Średnie
          - entity: sensor.last_exercise_heart_rate_maximum
            name: Maks.
