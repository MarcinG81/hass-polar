# ============================================================================
#  Polar – history dashboard for training + sleep tracking
# ============================================================================
#  Polar data is published as long-term statistics (polar:*). Most views use the
#  built-in statistics-graph card. The heart rate "zone" cards additionally use
#  the ApexCharts Card (HACS) and read the zone bounds from the
#  sensor.polar_loop_max_heart_rate attributes (pulled from the Polar API, so
#  they work for any user without hard-coded numbers).
#
#  HOW TO ADD/UPDATE (repo changes do NOT auto-apply to your dashboard):
#  New dashboard -> edit (pencil) -> top-right menu -> "Raw configuration
#  editor" -> select all, delete, paste this file -> Save -> hard refresh
#  the browser (Cmd/Ctrl+Shift+R).
#
#  The statistics appear after the first sync. You can verify them under
#  Developer Tools -> Statistics (search "polar").
# ============================================================================

title: Polar
views:
  # ==========================================================================
  #  SLEEP
  # ==========================================================================
  - title: Sleep
    path: sleep
    icon: mdi:sleep
    cards:
      - type: calendar
        title: Sleep nights
        initial_view: listWeek
        entities:
          - calendar.polar_loop_sleep

      - type: statistics-graph
        title: Sleep stages – last 28 days (minutes)
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:deep_sleep
            name: Deep
          - entity: polar:light_sleep
            name: Light
          - entity: polar:rem_sleep
            name: REM

      - type: statistics-graph
        title: Sleep score – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:sleep_score
            name: Sleep score

      - type: statistics-graph
        title: HRV and breathing (night) – last 28 days
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:heart_rate_variability
            name: HRV
          - entity: polar:breathing_rate
            name: Breathing

  # ==========================================================================
  #  TRAINING
  # ==========================================================================
  - title: Training
    path: training
    icon: mdi:run-fast
    cards:
      - type: calendar
        title: Workouts
        initial_view: listWeek
        entities:
          - calendar.polar_loop_exercises

      - type: markdown
        title: Recent workouts
        content: |
          {% set rows = state_attr('sensor.polar_loop_last_exercise', 'exercises') or [] %}
          | Date | Sport | Duration | Distance | Cal | Load | HR max |
          |---|---|---|---|---|---|---|
          {% for e in rows %}| {{ e.date }} | {{ e.sport }} | {{ e.duration }} | {{ (e.distance_km ~ ' km') if e.distance_km else '—' }} | {{ e.calories or '—' }} | {{ e.training_load or '—' }} | {{ e.heart_rate_maximum or '—' }} |
          {% endfor %}

      - type: statistics-graph
        title: Cardio load – last 28 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: polar:cardio_load
            name: Cardio load

  # ==========================================================================
  #  HEART RATE
  # ==========================================================================
  - title: Heart rate
    path: heart-rate
    icon: mdi:heart-pulse
    cards:
      - type: statistics-graph
        title: Heart rate – last 28 days (hourly)
        chart_type: line
        period: hour
        days_to_show: 28
        stat_types:
          - mean
          - min
          - max
        entities:
          - entity: sensor.polar_loop_heart_rate
            name: Heart rate

      # Heart rate with training zone bands (requires ApexCharts Card).
      # Zone bounds are read from the Max heart rate sensor's attributes, so
      # they work for any user without hard-coding numbers. If your entity has
      # a different prefix, adjust sensor.polar_loop_max_heart_rate below.
      - type: custom:apexcharts-card
        header:
          show: true
          title: Heart rate – % HRmax zones (48h)
        graph_span: 48h
        apex_config:
          chart:
            height: 320
          legend:
            show: false
        series:
          - entity: sensor.polar_loop_heart_rate
            name: HR
            type: line
            color: '#212121'
            stroke_width: 2
            statistics:
              type: mean
              period: hour
          - entity: sensor.polar_loop_max_heart_rate
            name: Z1
            type: line
            color: '#9e9e9e'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_percent_max;
              if (!z) return [];
              return [[start.getTime(), z[1]], [end.getTime(), z[1]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z2
            type: line
            color: '#42a5f5'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_percent_max;
              if (!z) return [];
              return [[start.getTime(), z[2]], [end.getTime(), z[2]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z3
            type: line
            color: '#66bb6a'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_percent_max;
              if (!z) return [];
              return [[start.getTime(), z[3]], [end.getTime(), z[3]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z4
            type: line
            color: '#ffa726'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_percent_max;
              if (!z) return [];
              return [[start.getTime(), z[4]], [end.getTime(), z[4]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z5
            type: line
            color: '#ef5350'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_percent_max;
              if (!z) return [];
              return [[start.getTime(), z[5]], [end.getTime(), z[5]]];

      - type: custom:apexcharts-card
        header:
          show: true
          title: Heart rate – Karvonen (%HRR) zones (48h)
        graph_span: 48h
        apex_config:
          chart:
            height: 320
          legend:
            show: false
        series:
          - entity: sensor.polar_loop_heart_rate
            name: HR
            type: line
            color: '#212121'
            stroke_width: 2
            statistics:
              type: mean
              period: hour
          - entity: sensor.polar_loop_max_heart_rate
            name: Z1
            type: line
            color: '#9e9e9e'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_karvonen;
              if (!z) return [];
              return [[start.getTime(), z[1]], [end.getTime(), z[1]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z2
            type: line
            color: '#42a5f5'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_karvonen;
              if (!z) return [];
              return [[start.getTime(), z[2]], [end.getTime(), z[2]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z3
            type: line
            color: '#66bb6a'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_karvonen;
              if (!z) return [];
              return [[start.getTime(), z[3]], [end.getTime(), z[3]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z4
            type: line
            color: '#ffa726'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_karvonen;
              if (!z) return [];
              return [[start.getTime(), z[4]], [end.getTime(), z[4]]];
          - entity: sensor.polar_loop_max_heart_rate
            name: Z5
            type: line
            color: '#ef5350'
            stroke_width: 1
            show:
              legend_value: false
            data_generator: |
              const z = entity.attributes.zones_karvonen;
              if (!z) return [];
              return [[start.getTime(), z[5]], [end.getTime(), z[5]]];
